<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: -apple-system, sans-serif; font-size: 13px; padding: 15px; background: #f4f7f9; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    #url { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; margin-bottom: 12px; }
    .btn { background: #007aff; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
    .btn:disabled { background: #b0c4de; cursor: default; }
    .btn.secondary { background: #eef2f7; color: #1c1c1e; border: 1px solid #d7dee7; margin-top: 8px; }
    .btn.secondary:disabled { color: #9aa3ad; background: #f4f7f9; }
    .btn.danger { background: #ff3b30; margin-top: 8px; }
    .status-area { margin-top: 15px; padding: 12px; background: #eef2f7; border-radius: 8px; border-left: 4px solid #34c759; }
    .status-area.warn { border-left-color: #ff9500; }
    .label { font-size: 10px; color: #666; text-transform: uppercase; font-weight: bold; }
    #parent-txt, #folder-txt, #file-txt { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
    #counts { font-size: 11px; color: #666; margin-top: 8px; }
    #results { min-height: 100px; max-height: 200px; overflow-y: auto; margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px; }
    .note { color: #666; font-size: 11px; }
    .err { color: #c1121f; }
  </style>
</head>
<body>
  <div class="card">
    <input type="text" id="url" placeholder="Paste Google Drive URL here...">
    <button id="mainBtn" class="btn" onclick="mainAction()">Analyze Folder</button>
    <button id="cmpBtn" class="btn secondary" style="display:none" onclick="compareNow()"></button>
    <div id="doneNote" class="note" style="margin-top:8px"></div>
    <button id="bgBtn" class="btn secondary" style="display:none" onclick="toggleBackground()"></button>
    <button id="bgTrashBtn" class="btn secondary" style="display:none" onclick="toggleBackgroundTrash()"></button>
    <div id="bgNote" class="note" style="margin-top:6px"></div>

    <div class="status-area" id="statusArea">
      <div class="label">Parent Folder:</div>
      <div id="parent-txt">Idle</div>
      <div class="label" style="margin-top:8px">Scanning Folder:</div>
      <div id="folder-txt">Idle</div>
      <div class="label" style="margin-top:8px">Active File:</div>
      <div id="file-txt">Ready</div>
      <div id="counts"></div>
    </div>

    <div id="results"></div>
    <button id="delBtn" class="btn danger" style="display:none" onclick="trashAction()">Move Duplicates to Trash</button>
  </div>

  <script>
    /*
     * The server checkpoints everything it does, so the client's job is to keep
     * calling until the work is finished and to never leave the user stranded:
     *  - a failed call is retried instead of ending the run (MAX_RETRIES in a row),
     *  - "Pause & Compare" turns an unfinished scan into a usable duplicate list,
     *  - the trash button is offered whenever the sheet holds unhandled rows, no
     *    matter how the scan that produced them ended.
     */
    const MAX_RETRIES = 6;
    const RETRY_DELAY = 6000;
    // Lock contention is not a failure, so it gets its own budget: an execution can hold
    // the script lock for at most the 6-minute limit, and 20 x 20s comfortably outlasts it.
    const MAX_BUSY_WAITS = 20;
    const BUSY_DELAY = 20000;

    let pollInterval = null;
    let scanUrl = '';
    let scanning = false;
    let trashing = false;
    let decorating = false;
    let stopping = false;          // the reviewer pressed Pause; finish the chunk, then stop
    let failures = 0;
    let busyWaits = 0;
    let wantCompare = false;
    let state = {};

    document.addEventListener('DOMContentLoaded', refreshState);

    /* ------------------------------------------------------------------ state */

    function refreshState() {
      google.script.run.withSuccessHandler(st => {
        if (!st || st.error) return;
        state = st;
        if (!document.getElementById('url').value && st.rootUrl) {
          document.getElementById('url').value = st.rootUrl;
          scanUrl = st.rootUrl;
        }
        paintButtons();
        // A compare that ran out of time left links undecorated; pick that up on open.
        if (st.linksPending && !scanning && !trashing) finishLinks();
      }).getState();
    }

    function paintButtons() {
      const main = document.getElementById('mainBtn');
      const cmp = document.getElementById('cmpBtn');
      const del = document.getElementById('delBtn');

      // While a scan is looping, the main button becomes the way to stop it. Closing the
      // dialog still works as the safety net, but a visible Pause is the honest control.
      if (scanning) {
        main.disabled = stopping;
        main.innerText = stopping ? 'Pausing…' : 'Pause Scanning';
      } else {
        main.disabled = trashing;
        main.innerText = state.phase ? 'Resume Scan' : 'Analyze Folder';
      }

      /*
       * The compare button is only offered while there is something left to compare. Once
       * the walk has finished, processFolder has already run the comparison itself and
       * deleted the phase marker — so a button reading "Compare N Scanned Files Now" would
       * be inviting a rebuild nobody needs, and a rebuild brings back rows the reviewer
       * deleted on purpose. A sentence replaces it; the menu keeps the deliberate route.
       */
      const done = document.getElementById('doneNote');
      const finished = !state.phase && state.scannedFiles;

      if (scanning) {
        cmp.style.display = 'block';
        cmp.innerText = 'Pause & Compare What Is Scanned So Far';
        cmp.disabled = wantCompare;
        done.innerText = '';
      } else if (finished) {
        cmp.style.display = 'none';
        done.innerHTML = '<b>Scan complete — nothing left to compare.</b> ' +
          num(state.scannedFiles) + ' files scanned, ' + num(state.dupeTotal) + ' duplicates listed' +
          (state.dupePending ? ', ' + num(state.dupePending) + ' still to trash' : ' and all handled') +
          '.<br>Rebuilding the list is possible from 🚀 Angel → Compare Files Scanned So Far, ' +
          'but it brings back rows you deleted.';
      } else if (state.scannedFiles) {
        cmp.style.display = 'block';
        cmp.innerText = 'Compare ' + num(state.scannedFiles) + ' Scanned Files Now';
        cmp.disabled = trashing;
        done.innerText = '';
      } else {
        cmp.style.display = 'none';
        done.innerText = '';
      }

      paintBackground();

      if (state.dupePending) {
        del.style.display = 'block';
        if (trashing) {
          del.disabled = stopping;
          del.innerText = stopping ? 'Pausing…' : 'Pause Trashing';
        } else {
          // Trashing needs the script lock, which a running scan holds — pause it first.
          del.disabled = scanning;
          del.title = scanning ? 'Pause the scan first' : '';
          del.innerText = 'Move ' + state.dupePending + ' Duplicates to Trash' +
                          (scanning ? ' (pause the scan first)' : '');
        }
      } else {
        del.style.display = 'none';
      }
    }

    /*
     * Background mode hands the scan to a server-side trigger, so it survives this tab
     * closing and the machine being switched off. Offered whenever there is a scan to
     * continue; hidden once there is nothing left for it to do.
     */
    function paintBackground() {
      const btn = document.getElementById('bgBtn');
      const trashBtn = document.getElementById('bgTrashBtn');
      const note = document.getElementById('bgNote');
      const bg = state.background || {};
      const budget = bg.usedMin + ' of ' + bg.budgetMin + ' min used today';

      // Scanning in the background: offered while there is a walk to continue.
      const offerScan = bg.running || state.phase || state.linksPending;
      btn.style.display = offerScan ? 'block' : 'none';
      btn.disabled = bg.trashRunning;
      btn.innerText = bg.running ? 'Stop Background Scan' : 'Run in the Background (computer can be off)';

      // Trashing in the background: offered once there is a reviewed list to work through.
      const offerTrash = bg.trashRunning || (state.dupePending && !scanning && !trashing);
      trashBtn.style.display = offerTrash ? 'block' : 'none';
      trashBtn.disabled = bg.running;
      trashBtn.innerText = bg.trashRunning
        ? 'Stop Background Trashing'
        : 'Trash ' + state.dupePending + ' in the Background (computer can be off)';

      if (bg.trashRunning) {
        note.innerHTML = '<b>Trashing on Google\'s servers</b> every ' + bg.everyMinutes +
          ' min — this tab can be closed. ' + budget + '. Stops itself when the list is done.';
      } else if (bg.running) {
        note.innerHTML = '<b>Scanning on Google\'s servers</b> every ' + bg.everyMinutes +
          ' min — this tab can be closed. ' + budget + '. Never trashes.';
      } else if (offerScan || offerTrash) {
        note.innerHTML = 'Background jobs run with your computer off, one at a time, sharing ' +
          (bg.budgetMin || 300) + ' min/day of runtime (' + budget + ').';
      } else {
        note.innerText = '';
      }
    }

    /**
     * Unattended trashing is the only irreversible thing that can happen with nobody
     * watching, so it takes an explicit confirmation every time it is switched on.
     */
    function toggleBackgroundTrash() {
      const bg = state.background || {};
      const btn = document.getElementById('bgTrashBtn');
      const on = !bg.trashRunning;

      if (on && !confirm('Trash ' + state.dupePending + ' files in the background?\n\n' +
          'Every row of the Duplicates sheet with an empty Status will be moved to Drive Trash, ' +
          'with no browser open — including rows hidden by a filter.\n\n' +
          'Rows you deleted from the sheet are not touched, and nothing outside the sheet is ' +
          'touched. A duplicate whose original is already in the trash is skipped.\n\n' +
          'Uses the same ' + (bg.budgetMin || 300) + ' min/day budget as scanning and stops ' +
          'itself when the list is done. Trashed files stay recoverable for 30 days.')) return;

      btn.disabled = true;
      google.script.run.withSuccessHandler(res => {
        if (res && res.error) say('<b class="err">' + res.error + '</b>');
        else if (on) {
          say('<b>Background trashing is on.</b><span class="note"> It works through the sheet ' +
              'on Google\'s servers — close this tab if you like. It stops by itself when every ' +
              'row has a Status.</span>');
        } else {
          say('<b>Background trashing is off.</b><span class="note"> Rows already handled keep ' +
              'their Status.</span>');
        }
        refreshState();
      }).withFailureHandler(err => {
        btn.disabled = false;
        say('<b class="err">Could not change background trashing:</b> ' + errText(err));
      }).setBackgroundTrash(on, true);
    }

    function toggleBackground() {
      const btn = document.getElementById('bgBtn');
      const on = !(state.background && state.background.running);
      btn.disabled = true;
      google.script.run.withSuccessHandler(res => {
        if (res && res.error) { say('<b class="err">' + res.error + '</b>'); }
        else if (on) {
          say('<b>Background scanning is on.</b><span class="note"> The scan continues on ' +
              'Google\'s servers — you can close this tab and switch the computer off. It stops ' +
              'itself when the scan and comparison are done, and it never trashes anything.</span>');
        } else {
          say('<b>Background scanning is off.</b><span class="note"> Use Resume Scan to carry ' +
              'on by hand.</span>');
        }
        refreshState();
      }).withFailureHandler(err => {
        btn.disabled = false;
        say('<b class="err">Could not change background mode:</b> ' + errText(err));
      }).setBackgroundScan(on);
    }

    function poll() {
      google.script.run.withSuccessHandler(s => {
        if (!s) return;
        document.getElementById('parent-txt').innerText = s.currentParent || '...';
        document.getElementById('folder-txt').innerText = s.currentFolder || '...';
        document.getElementById('file-txt').innerText = s.currentFile || '...';
        document.getElementById('counts').innerText =
          (s.files ? s.files + ' files' : '') + (s.folders ? '  ·  folder ' + s.folders : '');
      }).getLiveStatus();
    }

    function startPolling() {
      clearInterval(pollInterval);
      pollInterval = setInterval(poll, 1000);
    }

    function stopPolling() {
      clearInterval(pollInterval);
      pollInterval = null;
      poll();
    }

    function say(html) { document.getElementById('results').innerHTML = html; }

    /** Thousands separators: six-figure counts are unreadable without them. */
    function num(n) { return Number(n || 0).toLocaleString(); }

    /**
     * Handles "the lock is held by another execution": wait, then call `again`. The lock
     * cannot be held longer than one execution, so this always resolves — but it is
     * bounded anyway, and `giveUp` runs if the wait is somehow never satisfied.
     */
    function waitForLock(message, again, giveUp) {
      busyWaits++;
      if (busyWaits > MAX_BUSY_WAITS) {
        busyWaits = 0;
        stopPolling();
        if (giveUp) giveUp();
        refreshState();
        say('<b class="err">Gave up waiting:</b> ' + message +
            '<br><span class="note">Nothing was lost. Reload the sheet and click the button ' +
            'again — work already done is recorded.</span>');
        return;
      }
      say('<b>Waiting…</b> ' + message + '<br><span class="note">Retrying in ' +
          (BUSY_DELAY / 1000) + 's (' + busyWaits + ' of ' + MAX_BUSY_WAITS +
          '). Progress so far is safe.</span>');
      setTimeout(again, BUSY_DELAY);
    }

    function errText(err) {
      if (!err) return 'the connection to Google dropped';
      return err.message || String(err) || 'unknown error';
    }

    /* ------------------------------------------------------------------- scan */

    /* The main button is Analyze/Resume when idle and Pause while a scan is looping. */
    function mainAction() {
      if (scanning) return pauseScanning();
      startScan();
    }

    /**
     * Stops a running scan without comparing. requestPause runs in its own execution, so it
     * works even while the current chunk holds the lock; the chunk then stops at the next
     * folder boundary with its checkpoint saved.
     */
    function pauseScanning() {
      stopping = true;
      wantCompare = false;
      paintButtons();
      say('<b>Pausing…</b><span class="note"> the scan stops at the next folder — usually a ' +
          'few seconds. Everything scanned so far is saved.</span>');
      google.script.run.requestPause();
    }

    function startScan() {
      const url = document.getElementById('url').value || scanUrl;
      if (!state.phase && !/^https?:/.test(url)) {
        return alert('Error: Please paste a Google Drive folder URL.');
      }
      scanUrl = url;
      scanning = true;
      stopping = false;
      failures = 0;
      wantCompare = false;
      paintButtons();
      document.getElementById('statusArea').className = 'status-area';
      say(state.phase ? 'Resuming scan…' : 'Scanning…');
      startPolling();
      callScan();
    }

    function callScan() {
      google.script.run.withSuccessHandler(handleFinish)
                       .withFailureHandler(handleScanFailure)
                       .processFolder(scanUrl);
    }

    /**
     * A transport-level failure (execution killed, network blip) is not the end of the
     * run: the checkpoint is on the server, so wait and call again. This is what used
     * to surface as a dead "Failed: undefined" with no way forward.
     */
    function handleScanFailure(err) {
      // Paused: stop here rather than retrying, since a fresh run clears the pause request.
      if (stopping) {
        stopping = false;
        scanning = false;
        stopPolling();
        say('<b>Scan paused.</b> Nothing is running.');
        return refreshState();
      }
      // A pause was requested: don't restart the scan (a fresh run clears the request),
      // just go compare what is on the sheet. That is what the user asked for anyway.
      if (wantCompare) {
        wantCompare = false;
        scanning = false;
        return runCompare();
      }
      failures++;
      if (failures > MAX_RETRIES) {
        scanning = false;
        stopPolling();
        refreshState();
        say('<b class="err">Scan stopped after ' + MAX_RETRIES + ' failed attempts:</b> ' +
            errText(err) + '<br><span class="note">Nothing is lost — everything scanned so far is ' +
            'checkpointed. Click <b>Resume Scan</b> to continue, or compare what is already ' +
            'scanned and trash those duplicates.</span>');
        return;
      }
      document.getElementById('statusArea').className = 'status-area warn';
      say('<b>Hit an error:</b> ' + errText(err) + '<br><span class="note">Retrying in ' +
          (RETRY_DELAY / 1000) + 's (attempt ' + failures + ' of ' + MAX_RETRIES +
          '). The scan continues where it stopped.</span>');
      setTimeout(callScan, RETRY_DELAY);
    }

    function handleFinish(res) {
      if (!res) return handleScanFailure(null);

      if (res.error) {
        if (res.busy) return waitForLock(res.error, callScan, () => { scanning = false; });
        if (res.resumable) return handleScanFailure({ message: res.error });
        scanning = false;
        stopPolling();
        refreshState();
        say('<b class="err">Error:</b> ' + res.error);
        return;
      }

      failures = 0;
      busyWaits = 0;
      document.getElementById('statusArea').className = 'status-area';

      if (res.paused) {
        scanning = false;
        stopping = false;
        stopPolling();
        if (wantCompare) {
          wantCompare = false;
          say('<b>Scan paused</b> after ' + res.count + ' files. Comparing what is scanned so far…');
          runCompare();
        } else {
          say('<b>Scan paused</b> after ' + res.count + ' files. Nothing is running. Click ' +
              '<b>Resume Scan</b> to continue, or trash what has already been found.');
          refreshState();
        }
        return;
      }

      if (res.timeout) {
        // The chunk ended on its own before the pause request reached it — same thing.
        if (stopping) {
          stopping = false;
          scanning = false;
          stopPolling();
          say('<b>Scan paused</b> after ' + res.count + ' files. Nothing is running.');
          refreshState();
          return;
        }
        if (wantCompare) {
          wantCompare = false;
          scanning = false;
          stopPolling();
          return runCompare();
        }
        say('<b>' + res.phase + ' paused at the 6-minute limit (' + res.count +
            ' files so far).</b><br>Resuming automatically in 3 seconds…');
        // Honour a pause clicked during the gap: a new chunk would clear the request
        // on the server and the user would wait out another full execution.
        setTimeout(() => {
          if (stopping) {                        // paused during the 3-second gap
            stopping = false;
            scanning = false;
            stopPolling();
            say('<b>Scan paused.</b> Nothing is running.');
            return refreshState();
          }
          if (!wantCompare) return callScan();
          wantCompare = false;
          scanning = false;
          stopPolling();
          runCompare();
        }, 3000);
        return;
      }

      wantCompare = false;                  // the whole tree got compared anyway
      scanning = false;
      stopPolling();
      showSummary(res, false);
    }

    /* ---------------------------------------------------------------- compare */

    function compareNow() {
      // Replacing an existing list is not free: rows deleted on purpose come back, with an
      // empty Status, which means they would be trashed on the next run.
      if (state.dupeTotal && !confirm('Rebuild the duplicate list?\n\n' +
          'The current list of ' + num(state.dupeTotal) + ' rows is replaced by a fresh ' +
          'comparison.\n\nRows you deleted from the sheet will come back. Trashed marks and ' +
          'your Swap decisions are kept for the rows that remain.')) return;

      document.getElementById('cmpBtn').disabled = true;
      if (!scanning) return runCompare();
      wantCompare = true;
      say('<b>Pausing the scan…</b><span class="note"> it stops at the next folder, then the ' +
          'files already scanned are compared.</span>');
      google.script.run.requestPause();   // the running scan returns {paused:true}
    }

    function runCompare() {
      startPolling();
      say('<b>Comparing scanned files…</b>');
      google.script.run.withSuccessHandler(res => {
        stopPolling();
        if (!res || res.error) {
          refreshState();
          return say('<b class="err">Could not compare:</b> ' + (res ? res.error : 'no response'));
        }
        showSummary(res, true);
      }).withFailureHandler(err => {
        stopPolling();
        refreshState();
        say('<b class="err">Could not compare:</b> ' + errText(err) +
            '<br><span class="note">Nothing was lost — try again.</span>');
      }).compareScannedSoFar();
    }

    function showSummary(res, partial) {
      const isPartial = partial || res.partial;
      let html = '<b>' + (isPartial ? 'Partial result — scan not finished. ' : 'Scan complete. ') +
                 res.dupeCount + ' duplicate(s)</b> among ' + res.totalFiles + ' file(s) scanned.' +
                 '<br><span class="note">' + res.skipped + ' skipped (Google-native or empty — never ' +
                 'reported as duplicates).' +
                 (res.alreadyHandled ? ' ' + res.alreadyHandled + ' row(s) were already handled earlier.' : '') +
                 '</span>';
      if (res.dupeCount) {
        html += '<br><br>Full list in the <a href="' + res.sheetUrl + '" target="_blank"><b>Duplicates</b></a> ' +
                'sheet. <b>The newest copy of each file is kept</b> as the original; every older copy is ' +
                'listed for trashing, with both dates shown. Delete any row you want left untouched, tick ' +
                '<b>Swap ⇄</b> to keep that copy instead, then trash the rest.' +
                (res.swapsKept ? '<br><span class="note">' + res.swapsKept + ' earlier swap(s) kept.</span>' : '') +
                (res.undated ? '<br><span class="note">' + res.undated + ' file(s) carry no date — they are ' +
                 'never chosen as the copy to keep over a dated one.</span>' : '');
      }
      if (isPartial) {
        html += '<br><span class="note">These duplicates can be trashed right now; click <b>Resume Scan</b> ' +
                'whenever you want the rest of the tree. Comparing again later keeps the rows already handled.</span>';
      }
      if (res.linksPending) {
        html += '<br><span class="note">Still making the links clickable and adding the swap boxes — the ' +
                'rows themselves are complete, so you can start reviewing and trashing now.</span>';
      }
      say(html);
      refreshState();
      if (res.linksPending) finishLinks();
    }

    /**
     * Finishes a decoration pass the compare ran out of time for. Purely cosmetic — the row
     * values are already written — so failures here are swallowed rather than surfaced.
     * One chain at a time: several refreshState calls would otherwise race for the lock.
     */
    function finishLinks() {
      if (decorating) return;
      decorating = true;
      const step = () => {
        google.script.run.withSuccessHandler(r => {
          if (!r || r.error) { decorating = false; return; }
          if (r.pending) return step();
          decorating = false;
          refreshState();
        }).withFailureHandler(() => { decorating = false; }).finishPendingLinks();
      };
      step();
    }

    /* ------------------------------------------------------------------ trash */

    /* The trash button is Move-to-Trash when idle and Pause while trashing. */
    function trashAction() {
      if (trashing) return pauseTrashing();
      confirmDelete();
    }

    /**
     * Trashing has no server-side pause flag — and should not: a half-trashed file is not a
     * thing. The chunk in flight finishes and marks its rows, then the loop stops.
     */
    function pauseTrashing() {
      stopping = true;
      paintButtons();
      say('<b>Pausing…</b><span class="note"> the batch in progress finishes first (up to a ' +
          'few minutes), then it stops. Every file already handled is marked in the sheet.</span>');
    }

    function confirmDelete() {
      if (!confirm('Move ' + state.dupePending + ' files to Trash?\n\nThe newest copy of each file stays; ' +
                   'only the older copies are trashed. Trashed files remain recoverable from Drive Trash.')) return;
      trashing = true;
      stopping = false;
      paintButtons();                                      // no other job may start now
      window.trashedTotal = 0;
      window.errorTotal = 0;
      window.skippedTotal = 0;
      failures = 0;
      busyWaits = 0;
      startPolling();
      runTrash();
    }

    function endTrash(html) {
      trashing = false;
      stopPolling();
      say(html);
      refreshState();
    }

    function runTrash() {
      google.script.run.withSuccessHandler(res => {
        if (!res) return handleTrashFailure(null);
        // Contention with a still-finishing chunk: wait it out, never end the job.
        if (res.busy) return waitForLock(res.error, runTrash, () => { trashing = false; });
        if (res.error && !res.resumable) {
          return endTrash('<b class="err">Trashing stopped:</b> ' + res.error);
        }
        window.trashedTotal += (res.trashed || 0);
        window.errorTotal += (res.errors || 0);
        window.skippedTotal += (res.skipped || 0);
        if (res.error) return handleTrashFailure({ message: res.error });

        failures = 0;
        busyWaits = 0;
        const tail = (window.errorTotal ? ', ' + window.errorTotal + ' failed' : '') +
                     (window.skippedTotal ? ', ' + window.skippedTotal + ' skipped (original ' +
                      'already in the trash)' : '');
        if (stopping) {
          stopping = false;
          return endTrash('<b>Trashing paused.</b> ' + window.trashedTotal + ' file(s) trashed' +
                          tail + '.<br><span class="note">Click the button again to continue — ' +
                          'rows already marked are skipped.</span>');
        }
        if (res.remaining > 0) {
          say('<b>Trashing…</b> ' + window.trashedTotal + ' done, ' + res.remaining +
              ' to go. Continuing past the 6-minute limit…');
          setTimeout(runTrash, 2000);
          return;
        }
        endTrash('<b>Done.</b> ' + window.trashedTotal + ' file(s) trashed' + tail +
                 (window.errorTotal || window.skippedTotal ? ' — see the Status column in the Duplicates sheet.' : '.'));
      }).withFailureHandler(handleTrashFailure).trashDuplicates();
    }

    /** Same idea as the scan: rows are marked as they go, so retrying only ever continues. */
    function handleTrashFailure(err) {
      failures++;
      if (failures > MAX_RETRIES) {
        endTrash('<b class="err">Trashing stopped after ' + MAX_RETRIES + ' failed attempts:</b> ' +
                 errText(err) + '<br><span class="note">' + window.trashedTotal + ' file(s) were trashed. ' +
                 'The Status column records exactly which — click the trash button again to continue ' +
                 'with the rest.</span>');
        return;
      }
      say('<b>Trashing hit an error:</b> ' + errText(err) + '<br><span class="note">Retrying in ' +
          (RETRY_DELAY / 1000) + 's (attempt ' + failures + ' of ' + MAX_RETRIES +
          '). Rows already marked are skipped.</span>');
      setTimeout(runTrash, RETRY_DELAY);
    }
  </script>
</body>
</html>
